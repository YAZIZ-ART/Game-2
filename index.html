<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aetheria: Echoes of the Five Elements</title>
  <link rel="stylesheet" href="main.css">

  <!-- Menampilkan error / file yang gagal dimuat langsung di layar (berguna di HP) -->
  <script>
    window.addEventListener('error', function (e) {
      var msg;
      if (e.target && e.target !== window && (e.target.src || e.target.href)) {
        msg = 'Gagal memuat: ' + (e.target.src || e.target.href).split('/').slice(-2).join('/');
      } else {
        msg = (e.message || 'Error') + ' [' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ']';
      }
      var b = document.getElementById('err');
      if (!b) {
        b = document.createElement('pre');
        b.id = 'err';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99998;margin:0;padding:6px;' +
          'background:rgba(120,0,0,.92);color:#fff;font:11px monospace;white-space:pre-wrap;max-height:35%;overflow:auto';
        document.body.appendChild(b);
      }
      b.textContent += msg + '\n';
    }, true);
  </script>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="480" height="270"></canvas>

    <!-- Lapisan antarmuka (diisi oleh ui.js) -->
    <div id="ui">
      <div id="hud"></div>
      <div id="menu" class="layer"></div>
      <div id="dialog" class="layer hidden"></div>
    </div>

    <!-- Kontrol sentuh untuk HP (diisi oleh input.js) -->
    <div id="touch">
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="buttons">
        <button id="btn-attack" type="button">Serang</button>
        <button id="btn-skill" type="button">Skill</button>
        <button id="btn-elem" type="button">Elemen</button>
        <button id="btn-dash" type="button">Dash</button>
      </div>
    </div>
  </div>

  <!-- Urutan muat tidak boleh diubah -->
  <script src="config.js"></script>
  <script src="input.js"></script>
  <script src="assets.js"></script>
  <script src="particles.js"></script>
  <script src="map.js"></script>
  <script src="entities.js"></script>
  <script src="combat.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
