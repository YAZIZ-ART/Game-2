
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090814">
  <title>Aetheria</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <main id="app">
    <header id="topbar">
      <strong>AETHERIA</strong>
      <span id="status">Memuat game...</span>
    </header>

    <section id="game-wrap">
      <canvas id="game"></canvas>

      <div id="error" hidden></div>

      <div id="touch-controls">
        <div class="dpad">
          <button data-key="ArrowUp">▲</button>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>

        <div class="actions">
          <button data-action="attack">Serang</button>
          <button data-action="skill">Skill</button>
          <button data-action="element">Elemen</button>
          <button data-action="dash">Dash</button>
        </div>
      </div>
    </section>
  </main>

  <!-- MODUL UTAMA -->
  <script src="config.js"></script>
  <script src="map.js"></script>
  <script src="entities.js"></script>
  <script src="particles.js"></script>
  <script src="combat.js"></script>
  <script src="assets.js"></script>

  <!-- FILE TAMBAHAN -->
  <script src="input.js"></script>
  <script src="game.js"></script>

</body>
</html>
