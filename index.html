<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aetheria: Echoes of the Five Elements</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="480" height="270"></canvas>

    <!-- Lapisan antarmuka (diisi oleh js/ui.js) -->
    <div id="ui">
      <div id="hud"></div>
      <div id="menu" class="layer"></div>
      <div id="dialog" class="layer hidden"></div>
    </div>

    <!-- Kontrol sentuh untuk HP (diisi oleh js/input.js) -->
    <div id="touch">
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="buttons">
        <button id="btn-attack" type="button">Serang</button>
        <button id="btn-skill" type="button">Skill</button>
        <button id="btn-elem" type="button">Elemen</button>
      </div>
    </div>
  </div>

  <!-- Urutan muat tidak boleh diubah -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/map.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
